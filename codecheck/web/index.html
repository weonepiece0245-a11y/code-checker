<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码检查助手</title>
<link rel="icon" href="/static/app.png">
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2129;--muted:#6b7280;--line:#e3e6ea;--accent:#2563eb;
--err:#dc2626;--warn:#b45309;--ok:#15803d;--code:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--panel:#1a1d24;--text:#e6e8eb;--muted:#9aa1ac;
--line:#2c313a;--accent:#60a5fa;--err:#f87171;--warn:#fbbf24;--ok:#4ade80;--code:#0d0f13}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .muted{font-size:13px}
.muted{color:var(--muted)}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
textarea{width:100%;background:var(--code);color:var(--text);border:1px solid var(--line);border-radius:8px;
padding:10px;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:4}
#code{min-height:380px}
#stdin{min-height:60px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
label{font-size:13px;color:var(--muted)}
select,input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);padding:5px 10px;font-size:13px}
h2{font-size:15px;margin:16px 0 8px}
h2:first-child{margin-top:0}
.issue{padding:6px 8px;border-left:3px solid var(--warn);background:var(--code);border-radius:4px;margin:4px 0;font-size:13.5px;overflow-wrap:anywhere}
.issue.error{border-color:var(--err)}
pre{background:var(--code);padding:10px;border-radius:8px;overflow:auto;font-size:13px;margin:6px 0}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.badge.ok{color:var(--ok);border:1px solid var(--ok)}.badge.bad{color:var(--err);border:1px solid var(--err)}
.ai{overflow-wrap:anywhere}
.ai h2{border-bottom:1px solid var(--line);padding-bottom:4px}
.ai code{background:var(--code);padding:1px 4px;border-radius:4px}
.ai pre code{padding:0}
.codewrap{position:relative}
.codetools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
#updbar{display:none;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--code);border-bottom:1px solid var(--line);font-size:14px}
#updbar button{padding:6px 14px;font-size:14px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
button.second{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;background:var(--ok)}
.test{border:1px solid var(--line);border-radius:8px;margin:6px 0;padding:8px 10px}
.test.fail{border-color:var(--err)}
.test summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
.test summary::-webkit-details-marker{display:none}
.test .mark{font-weight:700}.test.pass .mark{color:var(--ok)}.test.fail .mark{color:var(--err)}
.test .purpose{font-size:13px;color:var(--muted);margin:2px 0 4px 22px}
.test .kv{font-size:13px;margin:4px 0 0 22px}
.test .kv b{color:var(--muted);font-weight:500}
.test pre{margin:3px 0}
.filebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.filebar button{padding:6px 12px;font-size:13.5px}
#filename{font-size:13px;color:var(--muted);overflow-wrap:anywhere;flex:1;min-width:120px}
#filename b{color:var(--text);font-weight:600}
#toast{font-size:13px;color:var(--ok)}
.frow{border:1px solid var(--line);border-radius:8px;margin:6px 0;padding:6px 10px}
.frow summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.frow summary::-webkit-details-marker{display:none}
.frow .fname{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
.frow.err{border-color:var(--err)} .frow.warn{border-color:var(--warn)}
.cnt{font-size:12px;padding:0 6px;border-radius:99px}
.cnt.e{color:var(--err);border:1px solid var(--err)} .cnt.w{color:var(--warn);border:1px solid var(--warn)}
.fissue{font-size:13px;padding:3px 6px;margin:3px 0 3px 18px;border-radius:4px;cursor:pointer;overflow-wrap:anywhere}
.fissue:hover{background:var(--code)}
.fissue .ln{color:var(--accent);font-weight:600}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:13px;cursor:pointer;text-decoration:underline}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>代码检查助手</h1>
  <span class="muted">静态检查 → 安全运行 → AI 讲解错误和修改建议</span>
  <span style="margin-left:auto;font-size:12px" class="muted"><span id="ver"></span>
    · <a href="#" id="checkupd" style="color:var(--accent)">检查更新</a></span>
</header>
<div id="updbar"><span id="updmsg"></span><button id="updbtn">一键更新</button></div>
<main>
  <section class="panel">
    <div class="filebar">
      <button class="second" id="openfile">📄 打开文件</button>
      <button class="second" id="openfolder">📁 检查文件夹</button>
      <button class="second" id="savefile" disabled>💾 保存（Ctrl+S）</button>
      <span id="filename">没有打开文件（也可以直接粘贴代码）</span>
      <span id="toast"></span>
    </div>
    <div class="row">
      <label>编程语言 <select id="lang"><option value="">自动识别</option><option value="python">Python</option><option value="javascript">JavaScript</option></select></label>
      <label>示例 <select id="sample"><option value="">选择一个有 bug 的例子…</option></select></label>
    </div>
    <textarea id="code" spellcheck="false" placeholder="在这里粘贴或输入代码"></textarea>
    <label>运行时输入（可选，程序里 input() / 读取 stdin 时用）</label>
    <textarea id="stdin" spellcheck="false"></textarea>
    <div class="row">
      <label><input type="checkbox" id="run" checked> 运行代码</label>
      <label>超时 <input type="number" id="timeout" value="5" min="1" max="60" style="width:60px"> 秒</label>
      <label>运行方式 <select id="sandbox"><option value="local">本机（受限）</option><option value="docker">Docker 隔离</option></select></label>
    </div>
    <div class="row">
      <label>AI <select id="ai"><option value="auto">自动</option><option value="cli">Claude Code 订阅</option><option value="api">API key</option><option value="none">不用 AI</option></select></label>
      <label>讲解语言 <select id="explain"><option>简体中文</option><option>繁體中文</option><option>English</option></select></label>
      <button id="go">检查（Ctrl+Enter）</button>
      <button id="gentests" class="second">AI 生成测试</button>
    </div>
    <div class="muted" id="aiinfo" style="font-size:12px"></div>
  </section>
  <div class="col">
    <section class="panel" id="folderout" style="display:none"></section>
    <section class="panel" id="out"><p class="muted">结果会显示在这里。</p></section>
    <section class="panel" id="testsout" style="display:none"></section>
  </div>
</main>
<script>
const SAMPLES = {
  "Python：除以零 + 拼写错误": {lang:"python", code:`def average(nums):
    total = 0
    for n in nums:
        total += n
    return totl / len(nums)

print(average([1, 2, 3]))
print(average([]))
`},
  "Python：读取输入时类型错误": {lang:"python", stdin:"5\n3\n", code:`a = input("第一个数：")
b = input("第二个数：")
print("和是", a + b)
print("差是", a - b)
`},
  "Python：死循环": {lang:"python", code:`i = 0
while i < 10:
    print(i)
`},
  "JavaScript：访问 undefined 的属性": {lang:"javascript", code:`const users = [{ name: "小明", age: 18 }, { name: "小红" }];

function oldest(list) {
  let best = list[0];
  for (let i = 0; i <= list.length; i++) {
    if (list[i].age > best.age) best = list[i];
  }
  return best.name;
}

console.log(oldest(users));
`},
};
const $ = id => document.getElementById(id);
for (const k of Object.keys(SAMPLES)) $("sample").add(new Option(k, k));
$("sample").onchange = e => { const s = SAMPLES[e.target.value]; if (!s) return;
  $("code").value = s.code; $("lang").value = s.lang; $("stdin").value = s.stdin || ""; };
$("code").addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); const t = e.target, p = t.selectionStart;
    t.setRangeText("    ", p, t.selectionEnd, "end"); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) go(); });
$("go").onclick = go;
fetch("/api/info").then(r => r.json()).then(d => {
  curVersion = d.version;
  $("ver").textContent = "版本 " + d.version;
  $("aiinfo").textContent = "自动模式当前会使用：" + ({api:"API key", cli:"Claude Code 订阅（claude 命令）", none:"不用 AI（没找到 API key 也没找到 claude 命令）"}[d.ai_auto]);
});
// ---------- 打开 / 保存文件 ----------
let curFile = null;  // {path, name, encoding, crlf, saved}
let lastFolder = null;
const dirOf = p => p.replace(/[\\/][^\\/]*$/, "");
function isDirty() { return curFile && $("code").value !== curFile.saved; }
function showFile() {
  if (!curFile) { $("filename").textContent = "没有打开文件（也可以直接粘贴代码）"; $("savefile").disabled = true; return; }
  $("filename").innerHTML = `<b>${esc(curFile.name)}</b>${isDirty() ? ' <span style="color:var(--warn)">● 未保存</span>' : ""}<br>${esc(curFile.path)}`;
  $("savefile").disabled = !isDirty();
  document.title = (isDirty() ? "● " : "") + curFile.name + " - 代码检查助手";
}
function toast(msg, bad) {
  $("toast").style.color = bad ? "var(--err)" : "var(--ok)";
  $("toast").textContent = msg;
  clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").textContent = "", 4000);
}
$("code").addEventListener("input", showFile);

async function openFile(path, line) {
  if (isDirty() && (!path || path !== curFile.path)
      && !confirm(`“${curFile.name}” 还没有保存，确定要打开别的文件吗？（没保存的修改会丢失）`)) return;
  try {
    if (!path) {
      const p = await post("/api/fs/pick", {kind: "file"});
      if (p.error) throw new Error(p.error);
      if (p.cancelled) return;
      path = p.path;
    }
    if (!(curFile && curFile.path === path && isDirty())) {
      const f = await post("/api/fs/read", {path});
      if (f.error) throw new Error(f.error);
      $("code").value = f.content;
      if (f.language) $("lang").value = f.language;
      curFile = {path: f.path, name: f.name, encoding: f.encoding, crlf: f.crlf, saved: f.content};
      $("stdin").value = "";
      $("out").innerHTML = '<p class="muted">已打开文件，点“检查”开始。</p>';
      $("testsout").style.display = "none"; lastTests = null;
    }
    showFile();
    if (line) gotoLine(line);
  } catch (e) { toast("打开失败：" + e.message, true); }
}

async function saveFile() {
  if (!curFile) { toast("请先用“打开文件”打开一个文件", true); return; }
  if (!isDirty()) { toast("没有需要保存的修改"); return; }
  try {
    const content = $("code").value;
    const r = await post("/api/fs/save", {path: curFile.path, content, encoding: curFile.encoding, crlf: curFile.crlf});
    if (r.error) throw new Error(r.error);
    curFile.saved = content; curFile.encoding = r.encoding;
    showFile();
    toast("已保存 ✓（原文件已备份）");
    if (lastFolder) scanFolder(lastFolder, true);
  } catch (e) { toast("保存失败：" + e.message, true); }
}

function gotoLine(n) {
  const ta = $("code"), lines = ta.value.split("\n");
  n = Math.max(1, Math.min(n, lines.length));
  let pos = 0;
  for (let i = 0; i < n - 1; i++) pos += lines[i].length + 1;
  ta.focus();
  ta.setSelectionRange(pos, pos + lines[n - 1].length);
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 20;
  ta.scrollTop = Math.max(0, (n - 4) * lh);
  ta.scrollIntoView({behavior: "smooth", block: "center"});
}

$("openfile").onclick = () => openFile();
$("savefile").onclick = saveFile;
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveFile(); }
});
window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

// ---------- 检查文件夹 ----------
async function scanFolder(path, quiet) {
  const box = $("folderout");
  try {
    if (!path) {
      const p = await post("/api/fs/pick", {kind: "folder"});
      if (p.error) throw new Error(p.error);
      if (p.cancelled) return;
      path = p.path;
    }
    lastFolder = path;
    box.style.display = "";
    if (!quiet) box.innerHTML = '<p><span class="spinner"></span> 正在检查文件夹里的所有代码文件…</p>';
    const r = await post("/api/fs/scan", {path});
    if (r.error) throw new Error(r.error);
    renderFolder(r);
  } catch (e) {
    box.style.display = "";
    box.innerHTML = '<p style="color:var(--err)">检查文件夹失败：' + esc(e.message) + '</p>';
  }
}

function renderFolder(r) {
  const box = $("folderout");
  const ok = r.files.filter(f => !f.issues.length);
  const bad = r.files.filter(f => f.issues.length);
  let h = `<h2>📁 文件夹检查 <span class="badge ${r.with_errors ? "bad" : "ok"}">${r.with_errors ? r.with_errors + " 个文件有错误" : "没有错误"}</span></h2>`;
  h += `<p class="muted" style="margin:0 0 6px;overflow-wrap:anywhere">${esc(r.folder)}<br>共 ${r.total} 个代码文件`
     + (r.with_warnings ? `，${r.with_warnings} 个只有警告` : "") + `。只做了静态检查，没有运行这些文件。点问题可以打开文件并跳到那一行。</p>`;
  if (r.truncated) h += `<p style="color:var(--warn);font-size:13px">文件太多，只检查了前 500 个。</p>`;
  r.notes.forEach(n => h += `<p style="color:var(--warn);font-size:13px">${esc(n)}</p>`);
  h += `<div class="row" style="margin:4px 0"><button class="ghost" id="rescan">重新检查文件夹</button><button class="ghost" id="closefolder">关闭</button></div>`;
  if (!r.total) h += `<p class="muted">这个文件夹里没有找到 .py 或 .js 文件。</p>`;
  bad.forEach((f, idx) => {
    h += `<details class="frow ${f.errors ? "err" : "warn"}" ${idx < 5 ? "open" : ""}>
      <summary><span>${f.errors ? "✗" : "!"}</span><span class="fname">${esc(f.rel)}</span>
        ${f.errors ? `<span class="cnt e">${f.errors} 错误</span>` : ""}${f.warnings ? `<span class="cnt w">${f.warnings} 警告</span>` : ""}
        <button class="linkbtn" data-open="${esc(f.path)}">打开</button></summary>
      ${f.issues.map(i => `<div class="fissue" data-open="${esc(f.path)}" data-line="${i.line}">
        <span class="ln">第 ${i.line} 行</span> <span style="color:${i.severity === "error" ? "var(--err)" : "var(--warn)"}">${i.severity === "error" ? "错误" : "警告"}</span>
        <code>${esc(i.code)}</code> ${esc(i.message)}</div>`).join("")}
    </details>`;
  });
  if (ok.length) {
    h += `<details class="frow"><summary><span style="color:var(--ok)">✓</span><span>${ok.length} 个文件没有发现问题</span></summary>
      ${ok.map(f => `<div class="fissue" data-open="${esc(f.path)}"><span class="fname">${esc(f.rel)}</span> <span class="muted">${f.lines} 行</span></div>`).join("")}
    </details>`;
  }
  box.innerHTML = h;
  box.querySelectorAll("[data-open]").forEach(el => el.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    openFile(el.dataset.open, el.dataset.line ? +el.dataset.line : 0);
  });
  $("rescan").onclick = () => scanFolder(lastFolder);
  $("closefolder").onclick = () => { box.style.display = "none"; lastFolder = null; };
}
$("openfolder").onclick = () => scanFolder();

// ---------- AI 生成测试 ----------
let lastTests = null;  // {summary, tests, language}
async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error("服务器返回 " + r.status);
  return r.json();
}
function testsBusy(html) {
  const box = $("testsout"); box.style.display = "";
  box.innerHTML = '<p><span class="spinner"></span> ' + html + '</p>';
  box.scrollIntoView({behavior: "smooth", block: "start"});
}
async function genTests() {
  const code = $("code").value;
  if (!code.trim()) { testsBusy("请先输入代码。"); return; }
  $("gentests").disabled = true;
  testsBusy("AI 正在读代码、设计测试，大约需要 10~40 秒…");
  try {
    const g = await post("/api/tests/generate", {code, language: $("lang").value || null,
      ai: $("ai").value === "none" ? "auto" : $("ai").value, explain_lang: $("explain").value});
    if (g.error) throw new Error(g.error);
    lastTests = g;
    await runTests();
  } catch (e) {
    $("testsout").innerHTML = '<p style="color:var(--err)">生成测试失败：' + esc(e.message) + '</p>';
  } finally { $("gentests").disabled = false; }
}
async function runTests() {
  if (!lastTests) return;
  testsBusy("正在逐个运行测试…");
  try {
    const r = await post("/api/tests/run", {code: $("code").value, language: lastTests.language,
      tests: lastTests.tests, timeout: +$("timeout").value || 5, sandbox: $("sandbox").value});
    if (r.error) throw new Error(r.error);
    renderTests(r);
  } catch (e) {
    $("testsout").innerHTML = '<p style="color:var(--err)">运行测试失败：' + esc(e.message) + '</p>';
  }
}
function renderTests(r) {
  const pct = r.total ? Math.round(r.passed / r.total * 100) : 0;
  const all = r.passed === r.total;
  let h = `<h2>测试结果 <span class="badge ${all ? "ok" : "bad"}">${r.passed} / ${r.total} 通过</span></h2>`;
  h += `<div class="bar"><i style="width:${pct}%"></i></div>`;
  h += `<p class="muted" style="margin:0 0 8px">代码的用途：${esc(lastTests.summary)}</p>`;
  h += `<div class="row" style="margin:0 0 6px"><button class="ghost" id="rerun">用当前代码重新运行这些测试</button>
        <button class="ghost" id="regen">重新生成测试</button></div>`;
  if (!all) h += `<p class="muted" style="font-size:13px;margin:4px 0">提示：点检查结果里的“放回编辑器”换成修好的代码，再点“用当前代码重新运行这些测试”，看看是不是全部通过。</p>`;
  r.results.forEach((t, i) => {
    const what = t.kind === "call" ? `<div class="kv"><b>测试代码</b><pre>${esc(t.code)}</pre></div>`
      : `<div class="kv"><b>输入</b><pre>${esc(t.stdin) || "（无）"}</pre></div>`;
    const actual = t.timed_out ? "超时（可能有死循环；如果是函数测试，也可能是顶层代码卡住了）" : (t.actual_output.trim() || "（无输出）");
    h += `<details class="test ${t.passed ? "pass" : "fail"}" ${t.passed ? "" : "open"}>
      <summary><span class="mark">${t.passed ? "✓" : "✗"}</span><span>${i + 1}. ${esc(t.name)}</span></summary>
      <div class="purpose">${esc(t.purpose)}</div>${what}
      <div class="kv"><b>期望输出</b>${t.expect_error ? "（应该报错）" : ""}<pre>${esc(t.expected_output.trim()) || "（无输出）"}</pre></div>
      <div class="kv"><b>实际输出</b><pre>${esc(actual)}</pre></div>
      ${t.error_line ? `<div class="kv"><b>报错</b><pre style="color:var(--err)">${esc(t.error_line)}</pre></div>` : ""}
    </details>`;
  });
  $("testsout").innerHTML = h;
  $("rerun").onclick = runTests;
  $("regen").onclick = genTests;
}
$("gentests").onclick = genTests;

// ---------- 一键更新 ----------
let curVersion = null;
async function checkUpdate(manual) {
  const bar = $("updbar"), msg = $("updmsg"), btn = $("updbtn");
  if (manual) { bar.style.display = "flex"; msg.textContent = "正在检查更新…"; btn.style.display = "none"; }
  try {
    const d = await (await fetch("/api/update/check")).json();
    if (d.has_update) {
      bar.style.display = "flex"; btn.style.display = ""; btn.disabled = false;
      msg.innerHTML = `发现新版本 <b>${d.remote}</b>（当前 ${d.local}）`;
    } else if (manual) {
      msg.textContent = d.error || `已经是最新版本 ${d.local}`;
      setTimeout(() => bar.style.display = "none", 3000);
    }
  } catch { if (manual) msg.textContent = "检查更新失败"; }
}
$("checkupd").onclick = e => { e.preventDefault(); checkUpdate(true); };
$("updbtn").onclick = async () => {
  const msg = $("updmsg"), btn = $("updbtn");
  btn.disabled = true; msg.innerHTML = '<span class="spinner"></span> 正在下载更新…';
  try {
    const d = await (await fetch("/api/update/apply", {method: "POST"})).json();
    if (!d.ok) { msg.textContent = d.message; btn.disabled = false; return; }
    msg.innerHTML = '<span class="spinner"></span> ' + d.message + "（大约 10 秒，页面会自动刷新）";
    btn.style.display = "none";
    const started = Date.now();
    const poll = setInterval(async () => {
      try {
        const info = await (await fetch("/api/info", {cache: "no-store"})).json();
        if (info.version !== curVersion) { clearInterval(poll); location.reload(); }
      } catch {}
      if (Date.now() - started > 90000) {
        clearInterval(poll);
        msg.textContent = "重启时间有点长，请关掉黑色窗口后双击桌面图标重新打开。";
      }
    }, 1500);
  } catch { msg.textContent = "更新失败，请稍后再试"; btn.disabled = false; }
};
checkUpdate(false);
// 心跳：告诉程序窗口还开着（备用窗口模式下，窗口关闭后程序会自动退出）
const ping = () => fetch("/api/ping", {method: "POST"}).catch(() => {});
ping(); setInterval(ping, 5000);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function go() {
  const code = $("code").value;
  if (!code.trim()) { $("out").innerHTML = '<p class="muted">请先输入代码。</p>'; return; }
  $("go").disabled = true;
  $("out").innerHTML = '<p><span class="spinner"></span> 正在检查' + ($("ai").value !== "none" ? "，AI 分析可能需要几十秒…" : "…") + '</p>';
  try {
    const r = await fetch("/api/check", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({code, language: $("lang").value || null, stdin: $("stdin").value,
        run: $("run").checked, timeout: +$("timeout").value || 5, sandbox: $("sandbox").value,
        ai: $("ai").value, explain_lang: $("explain").value,
        workdir: curFile ? dirOf(curFile.path) : null})});
    if (!r.ok) throw new Error("服务器返回 " + r.status + "：" + await r.text());
    render(await r.json());
  } catch (e) { $("out").innerHTML = '<p style="color:var(--err)">出错了：' + esc(e.message) + '</p>'; }
  finally { $("go").disabled = false; }
}

function render(d) {
  let h = `<h2>结论 <span class="badge ${d.passed ? "ok" : "bad"}">${d.passed ? "通过" : "有问题"}</span> <span class="muted" style="font-weight:400;font-size:13px">${esc(d.language)}</span></h2>`;
  h += `<h2>静态检查</h2>`;
  h += d.issues.length ? d.issues.map(i => `<div class="issue ${i.severity}"><b>${i.severity === "error" ? "错误" : "警告"}</b> 第 ${i.line} 行 <code>${esc(i.code)}</code> ${esc(i.message)}</div>`).join("") : `<p style="color:var(--ok)">✓ 没有发现问题</p>`;
  if (d.run_error) h += `<h2>运行</h2><p style="color:var(--err)">无法运行：${esc(d.run_error)}</p>`;
  else if (d.run) {
    const x = d.run;
    h += `<h2>运行结果 <span class="badge ${x.ok ? "ok" : "bad"}">${x.ok ? "正常结束" : (x.timed_out ? "超时" : "退出码 " + x.exit_code)}</span> <span class="muted" style="font-weight:400;font-size:13px">${x.duration_ms}ms · ${x.mode === "docker" ? "Docker" : "本机"}</span></h2>`;
    if (x.note) h += `<p style="color:var(--warn)">${esc(x.note)}</p>`;
    h += `<div class="muted">输出</div><pre>${esc(x.stdout) || "（空）"}</pre>`;
    if (x.stderr) h += `<div class="muted">错误输出</div><pre style="color:var(--err)">${esc(x.stderr)}</pre>`;
  }
  if (d.ai) {
    const md = (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parse(d.ai))
      : `<div style="white-space:pre-wrap">${esc(d.ai)}</div>`;
    h += `<h2>AI 分析 <span class="muted" style="font-weight:400;font-size:13px">${d.ai_backend === "api" ? "API key" : "Claude Code 订阅"}</span></h2><div class="ai">${md}</div>`;
  } else if (d.ai_error) h += `<h2>AI 分析</h2><p style="color:var(--warn)">${esc(d.ai_error)}</p>`;
  $("out").innerHTML = h;
  addCodeButtons();
}

// 给 AI 回答里的代码块加上“复制”和“放回编辑器”按钮
function addCodeButtons() {
  document.querySelectorAll(".ai pre").forEach(pre => {
    const code = pre.innerText;
    const bar = document.createElement("div");
    bar.className = "codetools";
    const copy = document.createElement("button");
    copy.className = "ghost"; copy.textContent = "复制";
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(code); copy.textContent = "已复制 ✓"; }
      catch { copy.textContent = "复制失败，请手动选择"; }
      setTimeout(() => copy.textContent = "复制", 2000);
    };
    const put = document.createElement("button");
    put.className = "ghost"; put.textContent = "放回编辑器";
    put.onclick = () => {
      $("code").value = code.replace(/\n$/, "");
      showFile();
      $("code").scrollIntoView({behavior: "smooth", block: "center"});
      put.textContent = "已放回 ✓，可以再点一次检查";
      setTimeout(() => put.textContent = "放回编辑器", 3000);
    };
    bar.append(copy, put);
    pre.after(bar);
  });
}
