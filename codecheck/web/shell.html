<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码检查助手</title>
<link rel="icon" href="/static/app.png">
<script>
// 本次启动的令牌：所有 /api 请求都自动带上
(() => {
  const TOKEN = "{{TOKEN}}", raw = window.fetch.bind(window);
  window.fetch = (url, opts = {}) => {
    if (typeof url === "string" && url.startsWith("/api/")) {
      opts = {...opts, headers: {...(opts.headers || {}), "X-Token": TOKEN}};
    }
    return raw(url, opts);
  };
})();
</script>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2129;--muted:#6b7280;--line:#e3e6ea;--accent:#2563eb;--err:#dc2626;--warn:#b45309;--ok:#15803d;--tab:#eceef2}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--panel:#1a1d24;--text:#e6e8eb;--muted:#9aa1ac;--line:#2c313a;--accent:#60a5fa;--err:#f87171;--warn:#fbbf24;--ok:#4ade80;--tab:#16191f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{padding:10px 18px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
.muted{color:var(--muted)}
#updbar{display:none;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;margin-top:8px}
#updbar button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
#tabbar{display:flex;align-items:flex-end;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;max-width:240px;min-width:120px;padding:7px 8px 7px 12px;border:1px solid var(--line);border-bottom:0;
  border-radius:9px 9px 0 0;background:var(--tab);color:var(--muted);cursor:pointer;font-size:13.5px;user-select:none;white-space:nowrap}
.tab.on{background:var(--panel);color:var(--text);font-weight:600;position:relative;top:1px}
.tab .name{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab .x{border:0;background:transparent;color:var(--muted);border-radius:6px;width:20px;height:20px;line-height:18px;font-size:15px;cursor:pointer;padding:0}
.tab .x:hover{background:var(--line);color:var(--text)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.tab .spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
#newtab{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 10px 8px;cursor:pointer;border-radius:8px}
#newtab:hover{background:var(--tab);color:var(--text)}
#frames{flex:1;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#frames iframe[hidden]{display:none}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>代码检查助手</h1>
  <span class="muted" style="font-size:13px">静态检查 → 安全运行 → AI 讲解错误和修改建议</span>
  <span class="muted" style="margin-left:auto;font-size:12px"><span id="ver"></span> · <a href="#" id="checkupd">检查更新</a></span>
</header>
<div id="updbar"><span id="updmsg"></span><button id="updbtn">一键更新</button></div>
<nav id="tabbar"><button id="newtab" title="新建标签页（Ctrl+T）">＋</button></nav>
<div id="frames"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MAX_TABS = 10;
let tabs = [], active = null, seq = 0;

function newTab() {
  if (tabs.length >= MAX_TABS) { alert(`最多同时打开 ${MAX_TABS} 个标签页。`); return; }
  const id = ++seq;
  const frame = document.createElement("iframe");
  frame.src = "/workspace?tab=" + id;
  $("frames").appendChild(frame);
  const el = document.createElement("div");
  el.className = "tab";
  el.innerHTML = '<span class="name"></span><button class="x" title="关闭（Ctrl+W）">×</button>';
  $("tabbar").insertBefore(el, $("newtab"));
  const t = {id, frame, el, title: "", dirty: false, busy: false, n: id};
  el.onclick = e => { if (!e.target.classList.contains("x")) activate(t); };
  el.onauxclick = e => { if (e.button === 1) closeTab(t); };
  el.querySelector(".x").onclick = () => closeTab(t);
  tabs.push(t);
  paint(t);
  activate(t);
}

function paint(t) {
  const name = t.title || `新标签页 ${t.n}`;
  t.el.querySelector(".name").textContent = name;
  t.el.title = name + (t.busy ? "（正在检查…）" : "") + (t.dirty ? "（有未保存的修改）" : "");
  t.el.querySelectorAll(".dot,.spin").forEach(x => x.remove());
  const mark = document.createElement("span");
  if (t.busy) mark.className = "spin"; else if (t.dirty) mark.className = "dot";
  if (mark.className) t.el.insertBefore(mark, t.el.firstChild);
}

function activate(t) {
  active = t;
  tabs.forEach(x => { x.frame.hidden = x !== t; x.el.classList.toggle("on", x === t); });
  t.el.scrollIntoView({block: "nearest", inline: "nearest"});
  document.title = (t.title ? t.title + " - " : "") + "代码检查助手";
  try { t.frame.contentWindow.focus(); } catch {}
}

function closeTab(t) {
  const name = t.title || `新标签页 ${t.n}`;
  if (t.busy && !confirm(`“${name}”还在检查中，关闭后这次的结果会丢失。确定关闭吗？`)) return;
  if (t.dirty && !confirm(`“${name}”有没保存的修改，关闭后会丢失。确定关闭吗？`)) return;
  const i = tabs.indexOf(t);
  tabs.splice(i, 1);
  t.frame.remove(); t.el.remove();
  if (!tabs.length) newTab();
  else if (active === t) activate(tabs[Math.min(i, tabs.length - 1)]);
}

function cycle(step) {
  const i = tabs.indexOf(active);
  activate(tabs[(i + step + tabs.length) % tabs.length]);
}

// 来自各个标签页的消息：标题、是否忙碌、是否有未保存修改、快捷键
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data) return;
  const t = tabs.find(x => x.frame.contentWindow === e.source);
  if (!t) return;
  const d = e.data;
  if (d.type === "state") { t.title = d.title || ""; t.dirty = !!d.dirty; paint(t); if (t === active) activate(t); }
  else if (d.type === "busy") { t.busy = !!d.busy; paint(t); }
  else if (d.type === "key") handleKey(d.key);
});

function handleKey(k) {
  if (k === "newtab") newTab();
  else if (k === "close" && active) closeTab(active);
  else if (k === "next") cycle(1);
  else if (k === "prev") cycle(-1);
}
document.addEventListener("keydown", e => {
  const k = keyOf(e);
  if (k) { e.preventDefault(); handleKey(k); }
});
function keyOf(e) {
  if (!(e.ctrlKey || e.metaKey)) return null;
  const key = e.key.toLowerCase();
  if (key === "t") return "newtab";
  if (key === "w") return "close";
  if (key === "tab") return e.shiftKey ? "prev" : "next";
  if (key === "pagedown") return "next";
  if (key === "pageup") return "prev";
  return null;
}
$("newtab").onclick = newTab;
$("tabbar").ondblclick = e => { if (e.target === $("tabbar")) newTab(); };

// 关闭整个窗口前：有没保存的修改就提醒
window.addEventListener("beforeunload", e => {
  if (tabs.some(t => t.dirty)) { e.preventDefault(); e.returnValue = ""; }
});

// ---------- 版本和一键更新 ----------
let curVersion = null;
fetch("/api/info").then(r => r.json()).then(d => { curVersion = d.version; $("ver").textContent = "版本 " + d.version; });
async function checkUpdate(manual) {
  const bar = $("updbar"), msg = $("updmsg"), btn = $("updbtn");
  if (manual) { bar.style.display = "flex"; msg.textContent = "正在检查更新…"; btn.style.display = "none"; }
  try {
    const d = await (await fetch("/api/update/check")).json();
    if (d.has_update) {
      bar.style.display = "flex"; btn.style.display = ""; btn.disabled = false;
      msg.innerHTML = `发现新版本 <b>${esc(d.remote)}</b>（当前 ${esc(d.local)}）`;
    } else if (manual) {
      msg.textContent = d.error || `已经是最新版本 ${d.local}`;
      setTimeout(() => bar.style.display = "none", 3000);
    }
  } catch { if (manual) msg.textContent = "检查更新失败"; }
}
$("checkupd").onclick = e => { e.preventDefault(); checkUpdate(true); };
$("updbtn").onclick = async () => {
  const msg = $("updmsg"), btn = $("updbtn");
  const busy = tabs.filter(t => t.busy || t.dirty);
  if (busy.length && !confirm("更新会重启程序，正在进行的检查和没保存的修改会丢失。确定现在更新吗？")) return;
  btn.disabled = true; msg.innerHTML = "正在下载更新…";
  try {
    const d = await (await fetch("/api/update/apply", {method: "POST"})).json();
    if (!d.ok) { msg.textContent = d.message; btn.disabled = false; return; }
    msg.textContent = d.message + "（大约 10 秒，页面会自动刷新）";
    btn.style.display = "none";
    tabs.forEach(t => { t.dirty = false; });
    const started = Date.now();
    const poll = setInterval(async () => {
      try {
        const info = await (await fetch("/api/info", {cache: "no-store"})).json();
        if (info.version !== curVersion) { clearInterval(poll); location.reload(); }
      } catch {}
      if (Date.now() - started > 90000) {
        clearInterval(poll);
        msg.textContent = "重启时间有点长，请关掉窗口后双击桌面图标重新打开。";
      }
    }, 1500);
  } catch { msg.textContent = "更新失败，请稍后再试"; btn.disabled = false; }
};
checkUpdate(false);

// 心跳：告诉程序窗口还开着（备用窗口模式下，窗口关闭后程序会自动退出）
const ping = () => fetch("/api/ping", {method: "POST"}).catch(() => {});
ping(); setInterval(ping, 5000);

newTab();
</script>
</body>
</html>
